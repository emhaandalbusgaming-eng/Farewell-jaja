<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<title>Farewell, Mas Jamaludin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d1117;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
  color: #fff;
}
#leaves { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.leaf {
  position: absolute;
  border-radius: 50% 0 50% 0;
  animation: fall linear infinite;
  pointer-events: none;
}
@keyframes fall {
  0%   { opacity: 0; top: -5%; transform: translateX(0) rotate(0deg); }
  10%  { opacity: .6; }
  100% { top: 108%; transform: translateX(160px) rotate(720deg); opacity: 0; }
}
.stage-wrap {
  position: relative;
  width: min(960px, 98vw);
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.sky-text-wrap {
  width: 100%;
  min-height: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 20px 20px 12px;
  opacity: 0;
  transition: opacity 0.7s;
}
.sky-text-wrap.visible { opacity: 1; }
.sky-line {
  font-family: 'Cormorant Garamond', 'Georgia', serif;
  font-weight: 400;
  font-style: italic;
  letter-spacing: .6px;
  line-height: 1.75;
  text-align: center;
  color: rgba(240,228,200,.88);
  -webkit-text-stroke: 0px;
  text-shadow: 0 2px 18px rgba(200,169,110,.18), 0 0 40px rgba(200,150,80,.08);
  transform: translateY(-28px);
  opacity: 0;
  clip-path: inset(0 0 100% 0);
  font-size: clamp(.88rem, 1.7vw, 1.22rem);
  max-width: 820px;
}
.sky-line.big {
  font-family: 'Playfair Display', 'Georgia', serif;
  font-weight: 900;
  font-style: normal;
  font-size: clamp(1.5rem, 3.8vw, 2.8rem);
  color: #f7d98a;
  -webkit-text-stroke: 0px;
  text-shadow: 0 0 30px rgba(243,156,18,.5), 0 0 70px rgba(243,156,18,.2), 0 2px 4px rgba(0,0,0,.4);
  letter-spacing: 2px;
}
.sky-line.reveal {
  animation: skyReveal 1.15s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes skyReveal {
  0%   { opacity:0; transform:translateY(-28px); clip-path:inset(0 0 100% 0); }
  40%  { opacity:1; }
  100% { opacity:1; transform:translateY(0); clip-path:inset(0 0 0% 0); }
}
.cinema-stage {
  width: 100%;
  background: linear-gradient(to top, #0d1318, #141c24);
  border-radius: 12px 12px 0 0;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 40px rgba(0,0,0,.7), 0 6px 24px rgba(0,0,0,.5);
}
canvas#stage { display:block; width:100%; image-rendering: pixelated; }

/* STARDEW DIALOG */
#dialog-box {
  width: 100%;
  background: linear-gradient(160deg, #1c1a2e, #12111f);
  border: 3px solid #c8a96e;
  border-top: 2px solid #a07840;
  border-radius: 0 0 12px 12px;
  padding: 0;
  min-height: 115px;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 8px 28px rgba(0,0,0,.65), inset 0 0 40px rgba(0,0,0,.3);
}
#dialog-box::before {
  content:'';
  position:absolute;
  inset: 5px;
  border: 1px solid rgba(200,169,110,.18);
  border-radius: 8px;
  pointer-events:none;
}
#dialog-box::after {
  content:'';
  position:absolute;
  top:0; left:0; right:0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(200,169,110,.4), transparent);
}
#dialog-header {
  display: flex;
  align-items: center;
  gap: 0;
}
#dialog-name {
  display: inline-block;
  background: linear-gradient(135deg, #c8a96e, #a07840);
  color: #1a1a2e;
  font-size: .7rem;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 4px 18px 4px 14px;
  border-radius: 0 0 10px 0;
  font-family: 'Courier New', monospace;
  clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
  padding-right: 28px;
}
#dialog-portrait {
  position: absolute;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  width: 56px;
  height: 56px;
  border: 2px solid #c8a96e;
  border-radius: 8px;
  background: radial-gradient(circle, #1a1535, #0d1020);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.7rem;
  box-shadow: 0 0 12px rgba(200,169,110,.25), inset 0 0 8px rgba(0,0,0,.4);
}
#dialog-text {
  font-family: 'Courier New', monospace;
  font-size: clamp(.76rem, 1.5vw, .93rem);
  color: #f0e6d3;
  line-height: 1.7;
  padding: 10px 88px 14px 18px;
  min-height: 78px;
  letter-spacing: .3px;
}
#dialog-cursor {
  position: absolute;
  bottom: 10px;
  right: 18px;
  color: #c8a96e;
  font-size: .68rem;
  font-family: 'Courier New', monospace;
  letter-spacing: 1px;
  animation: blink .9s step-end infinite;
  cursor: pointer;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* PROGRESS */
#progress {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
  z-index: 5;
}
.dot { width:7px;height:7px;border-radius:50%;background:rgba(200,169,110,.18);transition:background .3s; }
.dot.active { background:#c8a96e; box-shadow: 0 0 5px #c8a96e; }
.dot.done   { background:rgba(200,169,110,.45); }

/* MUSIC BTN */
#music-btn {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 99;
  background: linear-gradient(135deg, rgba(200,169,110,.3), rgba(160,120,64,.38));
  border: 2px solid #c8a96e;
  color: #ffe8a0;
  font-size: .92rem;
  font-weight: 900;
  letter-spacing: 2px;
  padding: 11px 24px;
  border-radius: 30px;
  cursor: pointer;
  transition: all .25s;
  font-family: 'Courier New', monospace;
  box-shadow: 0 0 18px rgba(200,169,110,.4), inset 0 1px 0 rgba(255,255,255,.12);
  text-shadow: 0 0 10px rgba(255,232,160,.7);
}
#music-btn:hover {
  background: linear-gradient(135deg, rgba(200,169,110,.52), rgba(160,120,64,.58));
  box-shadow: 0 0 28px rgba(200,169,110,.65);
}
#music-btn.off {
  background: rgba(40,34,28,.6);
  border-color: rgba(200,169,110,.3);
  color: rgba(200,169,110,.5);
  box-shadow: none; text-shadow: none;
}

/* TRANSITION OVERLAY */
#transition-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: #0a0814;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
#transition-overlay.fade-in  { opacity: 1; pointer-events: all; }
#transition-overlay.fade-out { opacity: 0; pointer-events: none; }

/* SPLASH SCREEN */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: radial-gradient(ellipse at center, #1a1230 0%, #0a0814 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; cursor: pointer; transition: opacity .7s ease;
}
#splash.hidden { opacity: 0; pointer-events: none; }
#splash-emoji { font-size: clamp(2.5rem,6vw,4rem); animation: float 2.5s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
#splash-title {
  font-family:'Courier New',monospace; font-weight:900; letter-spacing:4px;
  color:#c8a96e; text-align:center; text-shadow:0 0 30px rgba(200,169,110,.55);
  font-size:clamp(1.1rem,3vw,2rem);
}
#splash-sub {
  font-family:'Courier New',monospace; color:rgba(240,230,211,.55);
  letter-spacing:2px; text-align:center; font-size:clamp(.7rem,1.8vw,.95rem);
}
#splash-btn {
  margin-top:8px; background:transparent; border:2px solid #c8a96e;
  color:#c8a96e; font-family:'Courier New',monospace; font-weight:700;
  letter-spacing:3px; padding:14px 44px; border-radius:6px; cursor:pointer;
  font-size:clamp(.82rem,2vw,1.05rem); text-transform:uppercase;
  animation:pulseBorder 1.8s ease-in-out infinite;
}
@keyframes pulseBorder {
  0%,100%{box-shadow:0 0 0 0 rgba(200,169,110,.45);}
  50%{box-shadow:0 0 0 12px rgba(200,169,110,0);}
}
#splash-note {
  font-size:clamp(.6rem,1.3vw,.78rem); color:rgba(240,230,211,.3);
  letter-spacing:1px; font-family:'Courier New',monospace; text-align:center;
}

/* ── PHOTO MEMORY SCENE ── */
@keyframes sway {
  0%,100% { transform: var(--tilt) scale(1) translateY(0) rotate(0deg); }
  33%      { transform: scale(1) translateY(-4px) rotate(-1deg); }
  66%      { transform: scale(1) translateY(2px) rotate(1deg); }
}
#photo-scene {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: radial-gradient(ellipse at center, #1a1008 0%, #0a0804 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
}
#photo-scene.active { opacity: 1; pointer-events: all; }

/* Pixel Jamal zoomed */
#pixel-jamal-zoom {
  margin-bottom: 18px;
  image-rendering: pixelated;
  filter: drop-shadow(0 4px 18px rgba(243,156,18,.35));
  transform: scale(0.6);
  opacity: 0;
  transition: transform 1s cubic-bezier(.34,1.56,.64,1), opacity 0.8s ease;
}
#pixel-jamal-zoom.show { transform: scale(1); opacity: 1; }

/* Polaroid stack */
#polaroid-wrap {
  position: relative;
  width: min(320px, 80vw);
  height: min(420px, 68vw);
  margin: 0 auto;
}
.polaroid {
  position: absolute;
  inset: 0;
  background: #fdf8f0;
  border-radius: 4px;
  padding: 10px 10px 36px;
  box-shadow: 0 8px 32px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transform: rotate(0deg) scale(0.88) translateY(30px);
  transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.34,1.2,.64,1);
  pointer-events: none;
}
.polaroid.show {
  opacity: 1;
  transform: var(--tilt) scale(1) translateY(0);
  pointer-events: all;
}
.polaroid img {
  width: 100%;
  flex: 1;
  object-fit: cover;
  border-radius: 2px;
  display: block;
  min-height: 0;
}
.polaroid-caption {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-style: italic;
  font-size: clamp(.72rem, 2vw, .9rem);
  color: #4a3728;
  text-align: center;
  padding-top: 8px;
  line-height: 1.4;
}

/* Tap hint */
#photo-tap-hint {
  position: absolute;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Courier New', monospace;
  font-size: .68rem;
  letter-spacing: 2px;
  color: rgba(200,169,110,.55);
  animation: blink .9s step-end infinite;
  white-space: nowrap;
}
</style>
</head>
